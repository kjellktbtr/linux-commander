[project]
name = "linux-commander"
version = "0.1.0"
description = "A dual-pane orthodox file manager (Norton/Midnight/Total Commander style) built with plain tkinter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "ttkbootstrap>=1.10",
]

[project.optional-dependencies]
archives = ["py7zr>=0.20", "rarfile>=4.0", "libarchive-c>=5.0"]
crypto = ["cryptography>=49.0.0"]
ssh = ["paramiko>=3.0"]
documents = ["openpyxl>=3.1", "python-docx>=1.1", "pandas>=2.0", "xlrd>=2.0", "odfpy>=1.4"]
jotta = ["httpx>=0.27", "pydantic>=2.0", "keyring>=24.0"]
smb = ["smbprotocol>=1.10", "keyring>=24.0"]
webdav = ["webdavclient3>=3.14", "keyring>=24.0"]
svg = ["cairosvg>=2.7"]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.15.21",
]

[project.scripts]
linux-commander = "linux_commander.app:main"
linux-commander-install-extras = "linux_commander.install_extras:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linux_commander"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# This governs which syntax mypy itself will *parse* (including in bundled
# third-party stubs, e.g. numpy's -- which use PEP 695 `type` statements only
# valid from 3.12), not the language level linux-commander runs on: that's
# still `requires-python = ">=3.11"` above and ruff's target-version="py311"
# below, both enforced independently (and ultimately by the interpreter
# actually running the code). mypy has no per-module python_version option,
# so this can't be scoped to just the optional pandas/numpy dependency.
python_version = "3.12"
files = ["linux_commander"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "docx.*", "fitz"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smbprotocol.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["webdav3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cairosvg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
